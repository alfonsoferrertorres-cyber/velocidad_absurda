<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <title>Discografía & Reproductor | VELOCIDAD ABSURDA</title>
  <meta name="viewport" content="initial-scale=1, width=device-width"/>
  
  <link rel="stylesheet" href="https://arthurbeaulieu.github.io/ScrollBar.js/dist/ScrollBar.bundle.css"/>
  <link rel="stylesheet" href="/assets/dist/BW.bundle.css"/>
  <link rel="manifest" href="/assets/img/favicon/manifest.json">
</head>
<body data-type="listen">
  <section class="track-playback">
    <div id="release-background" class="blurred-background"></div>
    <div class="featured-track-wrapper">
      <div id="release-previous" class="previous-release">‹</div>
      <div class="featured-track-container">
        <img src="#" id="release-cover" alt="Portada de disco">
        <div class="player">
          <img src="/assets/img/controls/play.svg" id="play-pause" alt="Reproducir">
          <div class="progress-bar" id="progress-bar">
            <div class="current-progress" id="current-progress"></div>
          </div>
          <p id="release-duration">00:00</p>
        </div>
        <div id="release-tracklist" class="release-tracklist"></div>
      </div>
      <div id="release-next" class="next-release">›</div>
    </div>
  </section>

  <section class="track-links">
    <div class="track-link-bg-overlay">
      <div id="release-pager" class="release-pager"></div>
      <h1 id="release-title"></h1>
      <h2><span id="release-from"></span> <span id="release-artist"></span></h2>
      <p><b id="listen-online"></b> <span id="see-more-links"></span></p>
      <div class="listen-online">
        <a href="#" id="spotify" class="item" target="_blank" rel="noreferrer noopener"><p>Spotify</p></a>
        <a href="#" id="youtube" class="item" target="_blank" rel="noreferrer noopener"><p>YouTube</p></a>
        <a href="#" id="bandcamp" class="item" target="_blank" rel="noreferrer noopener"><p>Bandcamp</p></a>
      </div>
    </div>
  </section>

  <section class="credits">
    <div id="release-background-bottom" class="blurred-background"></div>
    <div class="credit-container">
      <p><i id="published-on"></i> <span id="release-date"></span><br><a href="#" id="label-link" target="_blank" rel="noreferrer noopener"></a></p>
    </div>
  </section>

  <a href="/" class="home"><img src="/assets/img/controls/home.svg" alt="Inicio"></a>
  <select id="lang-select">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>

  <div id="modal-overlay" class="modal-overlay"></div>
  <div id="loading-overlay" class="loading-overlay"></div>

  <script src="https://arthurbeaulieu.github.io/ScrollBar.js/dist/ScrollBar.bundle.js"></script>
  <script src="/assets/dist/BW.bundle.js"></script>
  <script>window.BW = new BW();</script>
</body>
</html>
